name: ClawFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 交付物（benchmark / OpenAPI / release bundle）需要能手动重跑
  workflow_dispatch:

# 只读令牌；同一分支上新的 push 取消还在跑的旧任务
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-artifacts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e .

      - name: Run tests
        run: python -m pytest -q

      - name: Run benchmark
        run: python -m scripts.run_benchmark

      - name: Export OpenAPI schema
        run: python -m scripts.export_openapi

      - name: Verify generated artifact files
        run: |
          test -f outputs/benchmark_results.json
          test -f outputs/evaluation_leaderboard.json
          test -f outputs/failure_recovery_report.md
          test -f docs/openapi.json

      - name: Build local release bundle
        run: python -m scripts.package_release

      - name: Verify deliverable completeness
        run: python -m scripts.verify_deliverables

      # 检查逻辑放在 scripts/check_markdown_links.py，本地 pytest 与 CI 跑同一份实现
      - name: Check markdown links resolve
        run: python -m scripts.check_markdown_links


  # 密钥一旦 commit 进历史就很难清干净（science-pop 就漏过一个 Coze PAT）。
  # 这里只匹配高置信度的前缀，不做熵分析，避免把 CI 变成误报噪音。
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Scan tracked files for committed credentials
        run: |
          python3 - <<'PY'
          import re, subprocess, sys

          PATTERNS = [
              ("GitHub token", re.compile(r"\b(ghp|gho|ghu|ghs|ghr)_[0-9A-Za-z]{20,}\b")),
              ("GitHub fine-grained PAT", re.compile(r"\bgithub_pat_[0-9A-Za-z_]{30,}\b")),
              ("OpenAI-style key", re.compile(r"\bsk-[0-9A-Za-z_-]{20,}\b")),
              ("AWS access key", re.compile(r"\bAKIA[0-9A-Z]{16}\b")),
              ("Slack token", re.compile(r"\bxox[baprs]-[0-9A-Za-z-]{10,}\b")),
              ("Google API key", re.compile(r"\bAIza[0-9A-Za-z_-]{30,}\b")),
              ("WeChat app secret", re.compile(
                  r"(?i)\b(wxappsecret|wx_app_secret|app_secret)\b\s*[:=]\s*['\"]?([0-9a-f]{32})['\"]?")),
              ("Coze PAT", re.compile(r"\bpat_[0-9A-Za-z]{20,}\b")),
          ]
          SKIP = {".png", ".jpg", ".jpeg", ".gif", ".webp", ".ico", ".pdf", ".zip", ".gz",
                  ".pkl", ".pt", ".pth", ".ckpt", ".onnx", ".bin", ".dll", ".so", ".pdb",
                  ".docx", ".hdr", ".ttf", ".woff", ".woff2", ".mp3", ".mp4", ".wav", ".h5",
                  ".safetensors", ".lock", ".whl", ".jar", ".class"}

          files = subprocess.run(["git", "ls-files", "-z"], capture_output=True,
                                 text=True).stdout.split("\0")
          hits = []
          for name in filter(None, files):
              if name.endswith(tuple(SKIP)):
                  continue
              try:
                  blob = open(name, "rb").read(2 * 1024 * 1024)
              except OSError:
                  continue
              if b"\0" in blob:
                  continue
              text = blob.decode("utf-8", "replace")
              for label, pat in PATTERNS:
                  for m in pat.finditer(text):
                      hits.append(f"{label}: {name}: {m.group(0)[:24]}")
          if hits:
              print("\n".join(hits))
              sys.exit("发现疑似明文密钥（见上）；确认是误报就把该文件加进 SKIP 或换成占位符")
          print(f"ok  已扫描 {len([f for f in files if f])} 个文件，未发现明文密钥")
          PY
