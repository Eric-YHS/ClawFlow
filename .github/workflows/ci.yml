name: ClawFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 交付物（benchmark / OpenAPI / release bundle）需要能手动重跑
  workflow_dispatch:

# 只读令牌；同一分支上新的 push 取消还在跑的旧任务
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-artifacts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e .

      - name: Run tests
        run: python -m pytest -q

      - name: Run benchmark
        run: python -m scripts.run_benchmark

      - name: Export OpenAPI schema
        run: python -m scripts.export_openapi

      - name: Verify generated artifact files
        run: |
          test -f outputs/benchmark_results.json
          test -f outputs/evaluation_leaderboard.json
          test -f outputs/failure_recovery_report.md
          test -f docs/openapi.json

      - name: Build local release bundle
        run: python -m scripts.package_release

      - name: Verify deliverable completeness
        run: python -m scripts.verify_deliverables

      - name: Check markdown links resolve
        run: |
          python3 - <<'PY'
          import re, sys
          from pathlib import Path

          # markdown inline links / images: [text](dest) or ![alt](dest)
          link = re.compile(r'!?(?:\[[^\]]*\])\(([^)\s]+)')
          skip_dirs = {'node_modules', '.next', '.venv', 'site-packages', '.git'}
          bad = []
          for md in sorted(Path('.').rglob('*.md')):
              if skip_dirs.intersection(md.parts):
                  continue
              for m in link.finditer(md.read_text(encoding='utf-8', errors='replace')):
                  dest = m.group(1).strip().split('#')[0]
                  if not dest or dest.startswith(('http://', 'https://', 'mailto:', 'data:')):
                      continue
                  if not (md.parent / dest).resolve().exists():
                      bad.append(f'{md}: {dest}')
          if bad:
              print('Broken relative markdown links:')
              print('\n'.join(bad))
              sys.exit(1)
          print('ok  all relative markdown links resolve')
          PY

